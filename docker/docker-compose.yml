services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./../:/var/www
      - ./nginx/conf.d/:/etc/nginx/conf.d
    ports:
      - 8080:80
    depends_on:
      app:
        condition: service_healthy
    container_name: blog_nginx

  app:
    image: blog_app
    build:
      context: .
      dockerfile: ./app/Dockerfile
    volumes:
      - ./../:/var/www
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep 'php-fpm' | grep -v grep || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    container_name: blog_app
    restart: unless-stopped

  node:
    image: node:22-alpine
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www
    volumes:
      - ./../:/var/www
    ports:
      - "5173:5173"
    command: tail -f /dev/null
    container_name: blog_node

  schedule:
    image: blog_app
    user: "www-data"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./../:/var/www
    command: php artisan schedule:work
    container_name: blog_schedule

  # Обработчик очереди (QUEUE_CONNECTION=database): отправка писем рассылки
  # NewArticleMail не блокирует веб-запрос, а выполняется этим воркером.
  queue:
    image: blog_app
    user: "www-data"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./../:/var/www
    command: php artisan queue:work --sleep=1 --tries=3
    container_name: blog_queue

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "8026:8025"
    container_name: blog_mailhog

  db:
    image: mysql:8.0
    restart: always
    volumes:
      - ./tmp/db:/var/lib/mysql
    environment:
      MYSQL_DATABASE: laraorchid
      MYSQL_ROOT_PASSWORD: root
    ports:
      - 8101:3306
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    container_name: blog_db

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    ports:
      - 8899:80
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=root
    container_name: blog_phpmyadmin
