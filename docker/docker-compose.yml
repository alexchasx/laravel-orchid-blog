services:
  nginx:
    image: nginx
    volumes:
      - ./../:/var/www
      - ./nginx/conf.d/:/etc/nginx/conf.d
    ports:
      - 8080:80
    depends_on:
      - app
    container_name: blog_nginx

  app:
    image: blog_app
    build:
      context: .
      dockerfile: ./app/DockerFile
    volumes:
      - ./../:/var/www
    depends_on:
      - db
      - mailhog
    container_name: blog_app

  schedule:
    image: blog_app
    depends_on:
      - db
    volumes:
      - ./../:/var/www
    command: php artisan schedule:work
    container_name: blog_schedule

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8026:8025"
    container_name: blog_mailhog

  db:
    image: mysql:8.0
    restart: always
    volumes:
      - ./tmp/db:/var/lib/mysql
    environment:
      MYSQL_DATABASE: laraorchid
      MYSQL_ROOT_PASSWORD: root
    ports:
      - 8101:3306
    command: mysqld --character-set-server=utf8 --collation-server=utf8_unicode_ci
    container_name: blog_db

  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - 8899:80
    depends_on:
      - db
    environment:
      - PMA_ARBITRARY=1
    container_name: blog_phpmyadmin
