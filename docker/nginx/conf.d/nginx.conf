server {
    listen 80;
    listen [::]:80;

    root /var/www/public;
    # index index.php index.html index.htm;

    charset utf-8;

    # ---------------------------------------------------------------------------
    # gzip-сжатие
    # ---------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ---------------------------------------------------------------------------
    # Vite-сборка (public/build) — кэш 1 год, immutable (хеш в имени файла)
    # ---------------------------------------------------------------------------
    location /build {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------------
    # Медиа / storage (если подключена загрузка изображений)
    # ---------------------------------------------------------------------------
    location /storage {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------------
    # Основной роутинг Laravel
    # ---------------------------------------------------------------------------
    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
