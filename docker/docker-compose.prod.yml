# ============================================================
# Продакшн-конфигурация Docker Compose
# ============================================================
# Шаблон переменных: docker/.env.prod.example → скопировать в docker/.env.prod
# и заполнить (chmod 600).
#
# Контекст сборки — корень репозитория (build.context: ..), поэтому запускать
# из корня репо. --env-file нужен, чтобы интерполяция ${DB_*} в сервисе db
# брала значения из файла, а не дефолты:
#
#   docker compose -f docker/docker-compose.prod.yml --env-file docker/.env.prod up -d --build
# ============================================================

services:
  # ---------------------------------------------------------------------------
  # nginx — обратный прокси + раздача статики
  # ---------------------------------------------------------------------------
  nginx:
    # Отдельный тег от dev-образа (docker-compose.yml → blog_nginx): prod и dev
    # не должны переиспользовать и перезаписывать образы друг друга.
    image: blog_nginx_prod
    build:
      # Контекст — корень репозитория, чтобы COPY ./ клал в образ код Laravel,
      # а не каталог docker/. Файлы docker/ указываются как ./docker/app/...
      context: ..
      dockerfile: docker/app/Dockerfile.prod
      target: nginx
    restart: unless-stopped
    volumes:
      # Статика public/ уже в образе (стадия nginx). Медиа из публичного диска
      # берём из того же volume, что и app, — единая файловая модель.
      - app_storage:/var/www/storage:ro
      - ./nginx/conf.d/:/etc/nginx/conf.d
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    container_name: blog_nginx

  # ---------------------------------------------------------------------------
  # app — PHP-FPM 8.5
  # ---------------------------------------------------------------------------
  app:
    # Отдельный тег от dev-образа (docker-compose.yml → blog_app). Dev-образ
    # содержит только PHP-рантайм (код приходит из bind-mount), поэтому запуск
    # prod на общем теге без --build давал пустой /var/www — без vendor/ и artisan.
    image: blog_app_prod
    build:
      # Контекст — корень репозитория (код Laravel), а не каталог docker/.
      context: ..
      dockerfile: docker/app/Dockerfile.prod
      target: app
    # user: НЕ задаём — entrypoint выполняется от root (нужен chown на свежем
    # volume storage/), а php-fpm сам сбрасывает workers в пул www-data.
    env_file:
      - .env.prod
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - TZ=Europe/Moscow
    volumes:
      - app_storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    container_name: blog_app
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # schedule — `php artisan schedule:work` (автопубликация, отзывы)
  # ---------------------------------------------------------------------------
  schedule:
    image: blog_app_prod
    user: "www-data"
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - TZ=Europe/Moscow
    volumes:
      - app_storage:/var/www/storage
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    command: php artisan schedule:work
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    container_name: blog_schedule

  # ---------------------------------------------------------------------------
  # queue — `php artisan queue:work` (рассылка подписчикам)
  # ---------------------------------------------------------------------------
  queue:
    image: blog_app_prod
    user: "www-data"
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - TZ=Europe/Moscow
    volumes:
      - app_storage:/var/www/storage
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    command: php artisan queue:work --sleep=1 --tries=3
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    container_name: blog_queue

  # ---------------------------------------------------------------------------
  # db — MySQL 8.0
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env.prod
    # Переменные MYSQL_* берутся из env_file (DB_DATABASE, DB_USERNAME,
    # DB_PASSWORD, DB_ROOT_PASSWORD).  Не используем ${VAR:-default}
    # в environment:, иначе Docker Compose интерполирует их из shell-
    # окружения (проектового .env) и фолбэки changeme/changeme_root
    # перебивают реальные креды из docker/.env.prod.
    volumes:
      - mysql_data:/var/lib/mysql
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # ${DB_ROOT_PASSWORD} берётся из env_file — без дефолтного фолбэка,
      # иначе при отсутствии переменной в shell/env_file подставится
      # «changeme_root» вместо реального пароля.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    container_name: blog_db

# ---------------------------------------------------------------------------
# Тома
# ---------------------------------------------------------------------------
volumes:
  mysql_data:
    driver: local
  app_storage:
    driver: local
