# ============================================================
# Продакшн-конфигурация Docker Compose
# ============================================================
# Использовать: docker compose -f docker/docker-compose.prod.yml up -d
# Шаблон переменных: docker/.env.prod.example (заполнить и переименовать в .env.prod)
# ============================================================

services:
  # ---------------------------------------------------------------------------
  # nginx — обратный прокси + раздача статики
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./../:/var/www
      - ./nginx/conf.d/:/etc/nginx/conf.d
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    container_name: blog_nginx

  # ---------------------------------------------------------------------------
  # app — PHP-FPM 8.5
  # ---------------------------------------------------------------------------
  app:
    image: blog_app
    build:
      context: .
      dockerfile: ./app/Dockerfile.prod
    user: "www-data"
    env_file:
      - ../.env.prod
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - TZ=Europe/Moscow
    volumes:
      - app_storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm8.5 -t || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    container_name: blog_app
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # schedule — `php artisan schedule:work` (автопубликация, отзывы)
  # ---------------------------------------------------------------------------
  schedule:
    image: blog_app
    user: "www-data"
    restart: unless-stopped
    env_file:
      - ../.env.prod
    environment:
      - TZ=Europe/Moscow
    volumes:
      - app_storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
    command: php artisan schedule:work
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    container_name: blog_schedule

  # ---------------------------------------------------------------------------
  # queue — `php artisan queue:work` (рассылка подписчикам)
  # ---------------------------------------------------------------------------
  queue:
    image: blog_app
    user: "www-data"
    restart: unless-stopped
    env_file:
      - ../.env.prod
    environment:
      - TZ=Europe/Moscow
    volumes:
      - app_storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
    command: php artisan queue:work --sleep=1 --tries=3
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    container_name: blog_queue

  # ---------------------------------------------------------------------------
  # db — MySQL 8.0
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - ../.env.prod
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-laraorchid}
      - MYSQL_USER=${DB_USERNAME:-laravel}
      - MYSQL_PASSWORD=${DB_PASSWORD:-changeme}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-changeme_root}
    volumes:
      - mysql_data:/var/lib/mysql
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-changeme_root}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    container_name: blog_db

# ---------------------------------------------------------------------------
# Тома
# ---------------------------------------------------------------------------
volumes:
  mysql_data:
    driver: local
  app_storage:
    driver: local
